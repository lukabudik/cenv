name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Lint
        run: shellcheck -s bash -e SC2016 cenv.sh statusline.sh install.sh uninstall.sh
        if: runner.os == 'Linux'
      - run: test/run.sh
      - run: test/install.sh
